name: Release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release version (e.g., 0.1.0)'
        required: true
      nextVersion:
        description: 'Next development version (e.g., 0.2.0-SNAPSHOT)'
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
          fail-on-cache-miss: false
      - name: Pre-build h2-deterministic (required dependency for sql-state)
        run: ./mvnw -batch-mode install -DskipTests -pl h2-deterministic
      - name: Compile all modules
        run: ./mvnw -batch-mode clean install -DskipTests --file pom.xml
      - name: Save Maven cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-release-${{ github.sha }}

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Maven cache from test job
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-release-${{ github.sha }}
          fail-on-cache-miss: false

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set release version
        run: ./mvnw -batch-mode versions:set -DnewVersion=${{ github.event.inputs.releaseVersion }} -DgenerateBackupPoms=false

      - name: Update README with release version
        run: |
          sed -i "s/\*\*Current version\*\*: \`[^\`]*\`/\*\*Current version\*\*: \`${{ github.event.inputs.releaseVersion }}\`/g" README.md
          cat README.md | grep -E "(Current version|<version>)" | head -5
          echo "✓ Updated README.md with release version: ${{ github.event.inputs.releaseVersion }}"

      - name: Build and test release version
        run: |
          ./mvnw -batch-mode install -Ppre -DskipTests -pl h2-deterministic
          ./mvnw -batch-mode clean install

      - name: Deploy release to GitHub Packages
        id: deploy
        run: ./mvnw -batch-mode deploy -DskipTests -s .github/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit release version
        if: success()
        run: |
          git add -A
          git commit -m "Release ${{ github.event.inputs.releaseVersion }}"
          git tag v${{ github.event.inputs.releaseVersion }}

      - name: Set next development version
        if: success()
        run: ./mvnw -batch-mode versions:set -DnewVersion=${{ github.event.inputs.nextVersion }} -DgenerateBackupPoms=false

      - name: Update README for next development version
        if: success()
        run: |
          sed -i "s/\*\*Current version\*\*: \`[^\`]*\`/\*\*Current version\*\*: \`${{ github.event.inputs.nextVersion }}\`/g" README.md
          cat README.md | grep -E "(Current version|<version>)" | head -5
          echo "✓ Updated README.md with development version: ${{ github.event.inputs.nextVersion }}"

      - name: Commit next development version
        if: success()
        run: |
          git add -A
          git commit -m "Prepare next development iteration ${{ github.event.inputs.nextVersion }}"

      - name: Push changes and tags
        if: success()
        run: |
          git push origin HEAD:main
          git push origin v${{ github.event.inputs.releaseVersion }}

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.releaseVersion }}
          name: Release ${{ github.event.inputs.releaseVersion }}
          generate_release_notes: true
