name: Java CI

on:
  push:
    branches-ignore:
      - beads-sync
      - '**.beads'

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from previous builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
      - name: Install h2-deterministic (required shaded dependency)
        run: ./mvnw -batch-mode install -Ppre -DskipTests -pl h2-deterministic --file pom.xml
      - name: Compile all modules
        run: ./mvnw -batch-mode clean compile -DskipTests --file pom.xml
      - name: Save Maven cache after compile
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            target/
          key: delos-maven-${{ github.sha }}

  test-fireflies:
    needs: compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from compile job
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
          fail-on-cache-miss: false
      - name: Test Fireflies Module
        run: ./mvnw -batch-mode test -pl fireflies -Dforks=1 --file pom.xml
      - name: Save Maven cache after tests (with test dependencies)
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            target/
          key: delos-maven-tests-fireflies-${{ github.sha }}

  test-other-modules:
    needs: compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from compile job
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
          fail-on-cache-miss: false
      - name: Test Other Modules
        run: ./mvnw -batch-mode test -pl '!fireflies' --file pom.xml
      - name: Save Maven cache after tests (with test dependencies)
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            target/
          key: delos-maven-tests-other-${{ github.sha }}

  build-status:
    needs: [test-fireflies, test-other-modules]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check Test Results
        run: |
          if [ "${{ needs.test-fireflies.result }}" != "success" ] || [ "${{ needs.test-other-modules.result }}" != "success" ]; then
            echo "❌ Build FAILED: One or more test jobs failed"
            exit 1
          fi
          echo "✅ Build GREEN: All tests passed successfully"
