name: Java CI

on:
  push:
    branches-ignore:
      - beads-sync
      - '**.beads'

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from previous builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
      - name: Install h2-deterministic (required shaded dependency)
        run: ./mvnw -batch-mode install -Ppre -DskipTests -pl h2-deterministic --file pom.xml
      - name: Compile all modules
        run: ./mvnw -batch-mode clean compile -DskipTests --file pom.xml
      - name: Save Maven cache after compile
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            target/
          key: delos-maven-${{ github.sha }}

  test-fireflies:
    needs: compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from compile job
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
          fail-on-cache-miss: false
      - name: Test Fireflies Module
        run: ./mvnw -batch-mode test -pl fireflies -Dforks=1 --file pom.xml
      - name: Save Maven cache after tests (with test dependencies)
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            target/
          key: delos-maven-tests-fireflies-${{ github.sha }}

  test-heavy-modules:
    needs: compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from compile job
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
          fail-on-cache-miss: false
      - name: Test Heavy Modules (Ethereal, CHOAM, SQL-State)
        run: ./mvnw -batch-mode test -P test-heavy-modules --file pom.xml
      - name: Save Maven cache after heavy tests
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            target/
          key: delos-maven-tests-heavy-${{ github.sha }}

  test-identity-modules:
    needs: compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from compile job
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
          fail-on-cache-miss: false
      - name: Test Identity Modules (Stereotomy, Gorgoneion, Thoth)
        run: ./mvnw -batch-mode test -P test-identity-modules --file pom.xml
      - name: Save Maven cache after identity tests
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            target/
          key: delos-maven-tests-identity-${{ github.sha }}

  test-light-modules:
    needs: compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from compile job
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
          fail-on-cache-miss: false
      - name: Test Light Modules (Domain, Protocols, Membership, etc.)
        run: ./mvnw -batch-mode test -P test-light-modules --file pom.xml
      - name: Save Maven cache after light tests
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            target/
          key: delos-maven-tests-light-${{ github.sha }}

  build-status:
    needs: [test-fireflies, test-heavy-modules, test-identity-modules, test-light-modules]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check Test Results
        run: |
          if [ "${{ needs.test-fireflies.result }}" != "success" ] || [ "${{ needs.test-heavy-modules.result }}" != "success" ] || [ "${{ needs.test-identity-modules.result }}" != "success" ] || [ "${{ needs.test-light-modules.result }}" != "success" ]; then
            echo "❌ Build FAILED: One or more test jobs failed"
            echo "  test-fireflies: ${{ needs.test-fireflies.result }}"
            echo "  test-heavy-modules: ${{ needs.test-heavy-modules.result }}"
            echo "  test-identity-modules: ${{ needs.test-identity-modules.result }}"
            echo "  test-light-modules: ${{ needs.test-light-modules.result }}"
            exit 1
          fi
          echo "✅ Build GREEN: All tests passed successfully"
