name: Java CI

on:
  push:
    branches-ignore:
      - beads-sync
      - '**.beads'

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from previous builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
      - name: Install h2-deterministic (required shaded dependency)
        run: ./mvnw -batch-mode install -DskipTests -pl h2-deterministic
      - name: Compile all modules
        run: ./mvnw -batch-mode clean install -DskipTests --file pom.xml
      - name: Save Maven cache after compile
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-${{ github.sha }}

  test-batch-1:
    needs: compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from compile job
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
          fail-on-cache-miss: false
      - name: Test Batch 1 (CHOAM checkpoint test + other modules)
        run: ./mvnw -batch-mode surefire:test -pl choam -Dtest='CHOAMCheckpointTest,DynamicTest,SessionTest' --file pom.xml && ./mvnw -batch-mode surefire:test -pl tron,schemas,domain-epoll,domain-kqueue,domain-sockets --file pom.xml
      - name: Save Maven cache after batch-1 tests
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-tests-batch-1-${{ github.sha }}

  test-batch-2:
    needs: compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from compile job
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
          fail-on-cache-miss: false
      - name: Test Batch 2 (CHOAM integration tests + membership layer)
        run: ./mvnw -batch-mode surefire:test -pl choam -Dtest='SynchronizationCircuitBreakerTest,CheckpointValidationRaceTest,CHOAMBlockValidationTest,CHOAMConcurrencyTest' --file pom.xml && ./mvnw -batch-mode surefire:test -pl cryptography,fireflies,stereotomy,thoth,java-noise --file pom.xml
      - name: Save Maven cache after batch-2 tests
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-tests-batch-2-${{ github.sha }}

  test-batch-3:
    needs: compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from compile job
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
          fail-on-cache-miss: false
      - name: Test Batch 3 (CHOAM correctness tests + consensus layer)
        run: ./mvnw -batch-mode surefire:test -pl choam -Dtest='CHOAMFSMErrorPathsTest,CallbackReentrancyTest,ViewStateContractTest,NestedLockDetectionTest,PendingQueueBoundsTest,TransactionSignatureTest' --file pom.xml && ./mvnw -batch-mode surefire:test -pl protocols,ethereal,memberships,gorgoneion,gorgoneion-client,vm-socket --file pom.xml
      - name: Save Maven cache after batch-3 tests
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-tests-batch-3-${{ github.sha }}

  test-batch-4:
    needs: compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from compile job
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
          fail-on-cache-miss: false
      - name: Test Batch 4 (CHOAM Byzantine safety tests + services layer)
        run: ./mvnw -batch-mode surefire:test -pl choam -Dtest='GenesisAssemblyTest,ByzantineFaultInjectionTest,DeterminismVerificationTest,CHOAMThreadAndLockingTest' --file pom.xml && ./mvnw -batch-mode surefire:test -pl stereotomy-services,grpc,sql-state,liquibase-deterministic,leyden --file pom.xml
      - name: Save Maven cache after batch-4 tests
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-tests-batch-4-${{ github.sha }}

  build-status:
    needs: [test-batch-1, test-batch-2, test-batch-3, test-batch-4]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check Test Results
        run: |
          if [ "${{ needs.test-batch-1.result }}" != "success" ] || [ "${{ needs.test-batch-2.result }}" != "success" ] || [ "${{ needs.test-batch-3.result }}" != "success" ] || [ "${{ needs.test-batch-4.result }}" != "success" ]; then
            echo "❌ Build FAILED: One or more test jobs failed"
            echo "  test-batch-1: ${{ needs.test-batch-1.result }}"
            echo "  test-batch-2: ${{ needs.test-batch-2.result }}"
            echo "  test-batch-3: ${{ needs.test-batch-3.result }}"
            echo "  test-batch-4: ${{ needs.test-batch-4.result }}"
            exit 1
          fi
          echo "✅ Build GREEN: All tests passed successfully"
