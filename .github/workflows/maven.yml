name: Java CI

on:
  push:
    branches-ignore:
      - beads-sync
      - '**.beads'

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from previous builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
      - name: Install h2-deterministic (required shaded dependency)
        run: ./mvnw -batch-mode install -Ppre -DskipTests -pl h2-deterministic --file pom.xml
      - name: Compile all modules
        run: ./mvnw -batch-mode clean compile -DskipTests --file pom.xml
      - name: Save Maven cache after compile
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            target/
          key: delos-maven-${{ github.sha }}

  test-fireflies:
    needs: compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from compile job
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
          fail-on-cache-miss: false
      - name: Test Fireflies Module
        run: ./mvnw -batch-mode test -pl fireflies -Dforks=1 --file pom.xml
      - name: Save Maven cache after tests (with test dependencies)
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            target/
          key: delos-maven-tests-fireflies-${{ github.sha }}

  test-consensus:
    needs: compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from compile job
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
          fail-on-cache-miss: false
      - name: Test BFT Consensus (Ethereal, CHOAM, SQL-State)
        run: ./mvnw -batch-mode test -pl ethereal,choam,sql-state --file pom.xml
      - name: Save Maven cache after consensus tests
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            target/
          key: delos-maven-tests-consensus-${{ github.sha }}

  test-identity:
    needs: compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from compile job
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
          fail-on-cache-miss: false
      - name: Test Identity (Stereotomy, Gorgoneion, Thoth)
        run: ./mvnw -batch-mode test -pl stereotomy,stereotomy-services,gorgoneion,gorgoneion-client,thoth --file pom.xml
      - name: Save Maven cache after identity tests
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            target/
          key: delos-maven-tests-identity-${{ github.sha }}

  test-infrastructure:
    needs: compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from compile job
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
          fail-on-cache-miss: false
      - name: Test Infrastructure (Crypto, gRPC, Protocols, etc.)
        run: ./mvnw -batch-mode test -pl cryptography,grpc,protocols,memberships,schemas,liquibase-deterministic --file pom.xml
      - name: Save Maven cache after infrastructure tests
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            target/
          key: delos-maven-tests-infrastructure-${{ github.sha }}

  test-domains:
    needs: compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from compile job
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
          fail-on-cache-miss: false
      - name: Test Application Domains (FSM, Process Model, RBAC, Platform)
        run: ./mvnw -batch-mode test -pl tron,model,delphinius,domain-epoll,domain-kqueue,domain-sockets,leyden,vm-socket,java-noise --file pom.xml
      - name: Save Maven cache after domain tests
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            target/
          key: delos-maven-tests-domains-${{ github.sha }}

  build-status:
    needs: [test-fireflies, test-consensus, test-identity, test-infrastructure, test-domains]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check Test Results
        run: |
          if [ "${{ needs.test-fireflies.result }}" != "success" ] || [ "${{ needs.test-consensus.result }}" != "success" ] || [ "${{ needs.test-identity.result }}" != "success" ] || [ "${{ needs.test-infrastructure.result }}" != "success" ] || [ "${{ needs.test-domains.result }}" != "success" ]; then
            echo "❌ Build FAILED: One or more test jobs failed"
            echo "  test-fireflies: ${{ needs.test-fireflies.result }}"
            echo "  test-consensus: ${{ needs.test-consensus.result }}"
            echo "  test-identity: ${{ needs.test-identity.result }}"
            echo "  test-infrastructure: ${{ needs.test-infrastructure.result }}"
            echo "  test-domains: ${{ needs.test-domains.result }}"
            exit 1
          fi
          echo "✅ Build GREEN: All tests passed successfully"
