name: Java CI

on:
  push:
    branches-ignore:
      - beads-sync
      - '**.beads'

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from previous builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
      - name: Install h2-deterministic (required shaded dependency)
        run: ./mvnw -batch-mode install -DskipTests -pl h2-deterministic
      - name: Compile all modules
        run: ./mvnw -batch-mode clean install -DskipTests --file pom.xml
      - name: Save Maven cache after compile
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-${{ github.sha }}

  test-units:
    needs: compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from compile job
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
          fail-on-cache-miss: false
      - name: Test Units (Infrastructure + Platform)
        run: CI=true ./mvnw -batch-mode surefire:test -pl cryptography,java-noise,protocols,memberships,grpc,tron,schemas,vm-socket,leyden --file pom.xml

  test-choam:
    needs: compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from compile job
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
          fail-on-cache-miss: false
      - name: Test CHOAM Core (regression tests only, no stress/concurrency)
        run: |
          CI=true ./mvnw -batch-mode surefire:test -pl choam -Dtest='DynamicTest,SessionTest,PendingQueueBoundsTest,TransactionSignatureTest,VersionCompatibilityTest,CHOAMCheckpointTest,SynchronizationCircuitBreakerTest,CheckpointValidationRaceTest,CHOAMBlockValidationTest,GenesisAssemblyTest,ByzantineFaultInjectionTest,DeterminismVerificationTest,ViewStateContractTest,NestedLockDetectionTest' --file pom.xml
          CI=true ./mvnw -batch-mode surefire:test -pl sql-state --file pom.xml

  test-consensus:
    needs: compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from compile job
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
          fail-on-cache-miss: false
      - name: Test Consensus (fireflies + ethereal, excluding stress tests)
        run: CI=true ./mvnw -batch-mode surefire:test -pl fireflies -Dtest='!ChurnTest,!LargeGossipPropagationTest' --file pom.xml && CI=true ./mvnw -batch-mode surefire:test -pl ethereal --file pom.xml

  test-identity:
    needs: compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from compile job
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
          fail-on-cache-miss: false
      - name: Test Identity (KERI stack + examples, excluding performance tests)
        run: |
          CI=true ./mvnw -batch-mode surefire:test -pl stereotomy,thoth,gorgoneion,gorgoneion-client,stereotomy-services,delphinius --file pom.xml
          CI=true ./mvnw -batch-mode surefire:test -pl examples/simple-kv-store,examples/local-demo,examples/multi-tenant-demo,examples/fsm-workflow --file pom.xml
          CI=true ./mvnw -batch-mode surefire:test -pl witness-service -Dtest='!Phase1CProductionSimulationTest,!FullPathPerformanceTest,!WitnessConsensusPerformanceTest,!RateAnomalyDetectorTest,!BLSPerformanceBenchmarkTest,!ByzantineDetectionPerformanceTest' --file pom.xml
          CI=true ./mvnw -batch-mode surefire:test -pl model -Dtest='!FireFliesTest' --file pom.xml

  build-status:
    needs: [test-units, test-choam, test-consensus, test-identity]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check Test Results
        run: |
          if [ "${{ needs.test-units.result }}" != "success" ] || [ "${{ needs.test-choam.result }}" != "success" ] || [ "${{ needs.test-consensus.result }}" != "success" ] || [ "${{ needs.test-identity.result }}" != "success" ]; then
            echo "❌ Build FAILED: One or more test jobs failed"
            echo "  test-units: ${{ needs.test-units.result }}"
            echo "  test-choam: ${{ needs.test-choam.result }}"
            echo "  test-consensus: ${{ needs.test-consensus.result }}"
            echo "  test-identity: ${{ needs.test-identity.result }}"
            exit 1
          fi
          echo "✅ Build GREEN: All tests passed successfully"
          echo "  test-units: ✅"
          echo "  test-choam: ✅"
          echo "  test-consensus: ✅"
          echo "  test-identity: ✅"
