name: Java CI

on:
  push:
    branches-ignore:
      - beads-sync
      - '**.beads'

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from previous builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
      - name: Install h2-deterministic (required shaded dependency)
        run: ./mvnw -batch-mode install -DskipTests -pl h2-deterministic
      - name: Compile all modules
        run: ./mvnw -batch-mode clean install -DskipTests --file pom.xml
      - name: Save Maven cache after compile
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-${{ github.sha }}

  test-batch-1:
    needs: compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from compile job
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
          fail-on-cache-miss: false
      - name: Test Batch 1 (Light CHOAM unit tests + light modules)
        run: ./mvnw -batch-mode surefire:test -pl choam -Dtest='DynamicTest,SessionTest,PendingQueueBoundsTest,TransactionSignatureTest' --file pom.xml && ./mvnw -batch-mode surefire:test -pl tron,schemas --file pom.xml
      - name: Save Maven cache after batch-1 tests
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-tests-batch-1-${{ github.sha }}

  test-batch-2a:
    needs: compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from compile job
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
          fail-on-cache-miss: false
      - name: Test Batch 2a (CHOAM checkpoint tests)
        run: ./mvnw -batch-mode surefire:test -pl choam -Dtest='CHOAMCheckpointTest,SynchronizationCircuitBreakerTest,CheckpointValidationRaceTest' --file pom.xml
      - name: Save Maven cache after batch-2a tests
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-tests-batch-2a-${{ github.sha }}

  test-batch-2b:
    needs: compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from compile job
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
          fail-on-cache-miss: false
      - name: Test Batch 2b (CHOAM validation + sql-state)
        run: ./mvnw -batch-mode surefire:test -pl choam -Dtest='CHOAMBlockValidationTest' --file pom.xml && ./mvnw -batch-mode surefire:test -pl sql-state --file pom.xml
      - name: Save Maven cache after batch-2b tests
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-tests-batch-2b-${{ github.sha }}

  test-batch-3a:
    needs: compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from compile job
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
          fail-on-cache-miss: false
      - name: Test Batch 3a (CHOAM concurrency + correctness tests)
        run: ./mvnw -batch-mode surefire:test -pl choam -Dtest='CHOAMConcurrencyTest,CHOAMFSMErrorPathsTest,CallbackReentrancyTest,ViewStateContractTest,NestedLockDetectionTest' -Dlarge_tests=true --file pom.xml
      - name: Save Maven cache after batch-3a tests
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-tests-batch-3a-${{ github.sha }}

  test-batch-3b:
    needs: compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from compile job
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
          fail-on-cache-miss: false
      - name: Test Batch 3b (Consensus layer - fireflies + ethereal)
        run: ./mvnw -batch-mode surefire:test -pl fireflies,ethereal --file pom.xml
      - name: Save Maven cache after batch-3b tests
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-tests-batch-3b-${{ github.sha }}

  test-batch-3c:
    needs: compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from compile job
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
          fail-on-cache-miss: false
      - name: Test Batch 3c (Identity/services layer)
        run: ./mvnw -batch-mode surefire:test -pl cryptography,stereotomy,thoth,java-noise,protocols,memberships,gorgoneion,gorgoneion-client,vm-socket,stereotomy-services,grpc,liquibase-deterministic,leyden --file pom.xml
      - name: Save Maven cache after batch-3c tests
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-tests-batch-3c-${{ github.sha }}

  test-batch-4:
    needs: compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Maven cache from compile job
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-${{ github.sha }}
          restore-keys: |
            delos-maven-${{ github.ref }}-
            delos-maven-refs/heads/main-
            delos-maven-
          fail-on-cache-miss: false
      - name: Test Batch 4 (CHOAM Byzantine safety tests ONLY)
        run: ./mvnw -batch-mode surefire:test -pl choam -Dtest='GenesisAssemblyTest,ByzantineFaultInjectionTest,DeterminismVerificationTest,CHOAMThreadAndLockingTest' -Dlarge_tests=true --file pom.xml
      - name: Save Maven cache after batch-4 tests
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: delos-maven-tests-batch-4-${{ github.sha }}

  build-status:
    needs: [test-batch-1, test-batch-2a, test-batch-2b, test-batch-3a, test-batch-3b, test-batch-3c, test-batch-4]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check Test Results
        run: |
          if [ "${{ needs.test-batch-1.result }}" != "success" ] || [ "${{ needs.test-batch-2a.result }}" != "success" ] || [ "${{ needs.test-batch-2b.result }}" != "success" ] || [ "${{ needs.test-batch-3a.result }}" != "success" ] || [ "${{ needs.test-batch-3b.result }}" != "success" ] || [ "${{ needs.test-batch-3c.result }}" != "success" ] || [ "${{ needs.test-batch-4.result }}" != "success" ]; then
            echo "❌ Build FAILED: One or more test jobs failed"
            echo "  test-batch-1: ${{ needs.test-batch-1.result }}"
            echo "  test-batch-2a: ${{ needs.test-batch-2a.result }}"
            echo "  test-batch-2b: ${{ needs.test-batch-2b.result }}"
            echo "  test-batch-3a: ${{ needs.test-batch-3a.result }}"
            echo "  test-batch-3b: ${{ needs.test-batch-3b.result }}"
            echo "  test-batch-3c: ${{ needs.test-batch-3c.result }}"
            echo "  test-batch-4: ${{ needs.test-batch-4.result }}"
            exit 1
          fi
          echo "✅ Build GREEN: All tests passed successfully"
