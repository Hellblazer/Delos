name: Maven Build with Coverage

on:
  push:
    branches: [ main, remediations ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'graalvm'
        cache: maven

    - name: Build and test with JaCoCo
      run: |
        ./mvnw clean test \
          -DargLine="${JACOCO_AGENT}" \
          -q

    - name: Generate JaCoCo report
      if: always()
      run: ./mvnw jacoco:report -q

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./target/site/jacoco/jacoco.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: false

    - name: Publish test results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: '**/target/surefire-reports/TEST-*.xml'
        check_name: Test Results
        comment_mode: always

    - name: Comment PR with coverage report
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          try {
            const report = fs.readFileSync('./target/site/jacoco/index.html', 'utf8');
            // Extract coverage percentage from HTML
            const match = report.match(/Total.*?(\d+%)/);
            if (match) {
              const coverage = match[1];
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `📊 **Coverage Report**: ${coverage}\n\nDetailed report: [JaCoCo Coverage](https://codecov.io/gh/${context.repo.owner}/${context.repo.repo})`
              });
            }
          } catch (e) {
            console.log('Could not parse coverage report:', e);
          }

    - name: Archive coverage reports
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: jacoco-report
        path: target/site/jacoco/
        retention-days: 30
