name: 168h Simulation (Full Week)

# Full 168-hour stability test
# Duration: 168 hours (7 days) + setup/teardown
# Cluster: 100 nodes (full production scale)
# Purpose: Production stability certification
#
# REQUIRES: Self-hosted runner (GitHub-hosted has 360min timeout)
# See: examples/local-demo/README-SIMULATION.md for runner setup

on:
  workflow_dispatch:  # Manual trigger only
    inputs:
      node_count:
        description: 'Number of nodes (default: 100)'
        required: false
        default: '100'
      enable_chaos:
        description: 'Enable chaos engineering'
        required: false
        default: 'true'
        type: boolean
      enable_heap_dumps:
        description: 'Enable periodic heap dumps'
        required: false
        default: 'true'
        type: boolean
      notify_slack:
        description: 'Send Slack notification on completion'
        required: false
        default: 'false'
        type: boolean

jobs:
  simulation-168h:
    name: 168h Simulation (${{ github.event.inputs.node_count || 100 }} nodes)
    runs-on: self-hosted  # REQUIRED - GitHub-hosted timeout is 6h max
    timeout-minutes: 10800  # 7.5 days (168h + 12h buffer)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify self-hosted runner
        run: |
          echo "Running on: $(hostname)"
          echo "Kernel: $(uname -a)"
          echo "Memory: $(free -h | grep Mem)"
          echo "Disk: $(df -h /)"
          docker --version
          docker compose version

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Create simulation data directories
        run: |
          mkdir -p examples/local-demo/simulation-data/heapdumps
          mkdir -p examples/local-demo/simulation-data/checkpoints
          mkdir -p examples/local-demo/simulation-results/metrics
          mkdir -p examples/local-demo/simulation-results/reports
          mkdir -p examples/local-demo/simulation-results/logs

      - name: Build simulation framework
        run: |
          ./mvnw clean package -pl examples/local-demo -am -DskipTests

      - name: Build Docker image
        run: |
          ./mvnw package -Pdocker -pl examples/local-demo -am -DskipTests

      - name: Calculate node scaling
        id: scaling
        run: |
          NODE_COUNT=${{ github.event.inputs.node_count || 100 }}
          MEMBER_COUNT=$((NODE_COUNT - 4))
          echo "node_count=${NODE_COUNT}" >> $GITHUB_OUTPUT
          echo "member_count=${MEMBER_COUNT}" >> $GITHUB_OUTPUT
          echo "Scaling to ${NODE_COUNT} total nodes (4 genesis + ${MEMBER_COUNT} members)"

      - name: Start Docker Compose cluster
        working-directory: examples/local-demo
        run: |
          docker compose -f compose-simulation.yaml up -d --scale node=${{ steps.scaling.outputs.member_count }}
          echo "Cluster started with ${{ steps.scaling.outputs.node_count }} nodes"
          echo "Start time: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > simulation-results/start-time.txt

      - name: Wait for cluster health
        working-directory: examples/local-demo
        run: |
          echo "Waiting for cluster to become healthy..."
          sleep 120
          docker compose -f compose-simulation.yaml ps

      - name: Verify cluster health
        working-directory: examples/local-demo
        run: |
          curl -f http://localhost:8080/health || (docker compose -f compose-simulation.yaml logs bootstrap && exit 1)
          curl -f http://localhost:9091/-/healthy || (docker compose -f compose-simulation.yaml logs prometheus && exit 1)
          echo "Cluster health check passed"

      - name: Run 168-hour simulation with chaos testing
        working-directory: examples/local-demo
        run: |
          echo "Starting 168-hour simulation at $(date)"
          ./mvnw exec:java -Psimulation \
            -Dexec.mainClass=com.hellblazer.delos.demo.simulation.SimulationOrchestrator \
            -Dsimulation.duration.hours=168 \
            -Dsimulation.nodeCount=${{ steps.scaling.outputs.node_count }} \
            -Dsimulation.enableHeapDumps=${{ github.event.inputs.enable_heap_dumps }} \
            -Dsimulation.enableChaos=${{ github.event.inputs.enable_chaos }} \
            -Dsimulation.chaosStrategy=AGGRESSIVE \
            -Dsimulation.prometheusUrl=http://localhost:9091
          echo "Simulation completed at $(date)"

      - name: Verify reports generated
        working-directory: examples/local-demo
        run: |
          echo "Checking for generated reports..."
          ls -lh simulation-results/reports/
          test -f simulation-results/reports/simulation-report.html || (echo "HTML report missing" && exit 1)
          test -f simulation-results/reports/simulation-report.json || (echo "JSON report missing" && exit 1)
          test -f simulation-results/reports/simulation-report.md || (echo "Markdown report missing" && exit 1)
          echo "All reports generated successfully"

      - name: Generate executive summary
        if: always()
        working-directory: examples/local-demo
        run: |
          echo "# 168h Simulation - Executive Summary" > simulation-results/EXECUTIVE_SUMMARY.md
          echo "" >> simulation-results/EXECUTIVE_SUMMARY.md
          echo "**Run ID:** ${{ github.run_number }}" >> simulation-results/EXECUTIVE_SUMMARY.md
          echo "**Start Time:** $(cat simulation-results/start-time.txt)" >> simulation-results/EXECUTIVE_SUMMARY.md
          echo "**End Time:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> simulation-results/EXECUTIVE_SUMMARY.md
          echo "**Nodes:** ${{ steps.scaling.outputs.node_count }}" >> simulation-results/EXECUTIVE_SUMMARY.md
          echo "**Chaos Enabled:** ${{ github.event.inputs.enable_chaos }}" >> simulation-results/EXECUTIVE_SUMMARY.md
          echo "**Heap Dumps Enabled:** ${{ github.event.inputs.enable_heap_dumps }}" >> simulation-results/EXECUTIVE_SUMMARY.md
          echo "" >> simulation-results/EXECUTIVE_SUMMARY.md
          echo "## Results" >> simulation-results/EXECUTIVE_SUMMARY.md
          echo "See detailed reports in artifacts." >> simulation-results/EXECUTIVE_SUMMARY.md
          cat simulation-results/EXECUTIVE_SUMMARY.md

      - name: Collect container logs
        if: always()
        working-directory: examples/local-demo
        run: |
          echo "Collecting container logs..."
          docker compose -f compose-simulation.yaml logs > simulation-results/logs/docker-compose.log 2>&1 || true
          docker compose -f compose-simulation.yaml logs bootstrap > simulation-results/logs/bootstrap.log 2>&1 || true
          docker compose -f compose-simulation.yaml logs kernel1 > simulation-results/logs/kernel1.log 2>&1 || true
          docker compose -f compose-simulation.yaml logs kernel2 > simulation-results/logs/kernel2.log 2>&1 || true
          docker compose -f compose-simulation.yaml logs kernel3 > simulation-results/logs/kernel3.log 2>&1 || true
          docker compose -f compose-simulation.yaml logs prometheus > simulation-results/logs/prometheus.log 2>&1 || true

      - name: Export Prometheus data
        if: always()
        working-directory: examples/local-demo
        run: |
          echo "Exporting Prometheus data..."
          # Create snapshot via API
          curl -X POST http://localhost:9091/api/v1/admin/tsdb/snapshot
          # Copy snapshot to results (if snapshot API is enabled)
          docker compose -f compose-simulation.yaml exec -T prometheus tar czf - /prometheus 2>/dev/null | \
            tar xzf - -C simulation-results/metrics/ 2>/dev/null || echo "Prometheus data export skipped"

      - name: Upload simulation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-reports-168h-${{ github.run_number }}
          path: examples/local-demo/simulation-results/reports/
          retention-days: 365  # Keep for 1 year

      - name: Upload simulation metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-metrics-168h-${{ github.run_number }}
          path: examples/local-demo/simulation-results/metrics/
          retention-days: 365  # Keep for 1 year

      - name: Upload heap dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-heapdumps-168h-${{ github.run_number }}
          path: examples/local-demo/simulation-data/heapdumps/
          retention-days: 90

      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-logs-168h-${{ github.run_number }}
          path: examples/local-demo/simulation-results/logs/
          retention-days: 90

      - name: Upload executive summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-summary-168h-${{ github.run_number }}
          path: examples/local-demo/simulation-results/EXECUTIVE_SUMMARY.md
          retention-days: 365

      - name: Publish to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: examples/local-demo/simulation-results/reports
          destination_dir: simulation-168h/${{ github.run_number }}

      - name: Cleanup Docker resources
        if: always()
        working-directory: examples/local-demo
        run: |
          docker compose -f compose-simulation.yaml down -v
          docker system prune -f

      - name: Send Slack notification
        if: github.event.inputs.notify_slack == 'true' && always()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "168h Delos Simulation Completed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*168h Delos Simulation Completed*\n\n*Status:* ${{ job.status }}\n*Nodes:* ${{ steps.scaling.outputs.node_count }}\n*Run:* #${{ github.run_number }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Results>"
                  }
                }
              ]
            }

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '168h Simulation Failed - Run #${{ github.run_number }}',
              body: `The 168h simulation failed during run #${{ github.run_number }}.

              **Configuration:**
              - Nodes: ${{ steps.scaling.outputs.node_count }}
              - Chaos: ${{ github.event.inputs.enable_chaos }}
              - Heap Dumps: ${{ github.event.inputs.enable_heap_dumps }}

              **Timeline:**
              - Start: $(cat examples/local-demo/simulation-results/start-time.txt || echo 'Unknown')
              - Failed: $(date -u +%Y-%m-%dT%H:%M:%SZ)

              **Logs:**
              [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

              **Artifacts:**
              - Reports: simulation-reports-168h-${{ github.run_number }}
              - Metrics: simulation-metrics-168h-${{ github.run_number }}
              - Heap Dumps: simulation-heapdumps-168h-${{ github.run_number }}
              - Logs: simulation-logs-168h-${{ github.run_number }}

              **Action Required:**
              This is a critical failure in production-scale testing. Please investigate immediately.`,
              labels: ['critical', 'simulation', '168h-simulation', 'production']
            });
