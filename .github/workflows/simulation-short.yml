name: Short Simulation (1h Validation)

# Runs on every commit to examples/local-demo/ to validate simulation framework
# Duration: ~90 minutes (1h simulation + setup/teardown)
# Cluster: 10 nodes (reduced from production 100)
# Purpose: Fast validation that simulation infrastructure works

on:
  push:
    branches: [main, develop]
    paths:
      - 'examples/local-demo/**'
      - '.github/workflows/simulation-short.yml'
  pull_request:
    paths:
      - 'examples/local-demo/**'
      - '.github/workflows/simulation-short.yml'
  workflow_dispatch:  # Manual trigger

jobs:
  short-simulation:
    name: 1h Simulation (10 nodes)
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2 hours total

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Create simulation data directories
        run: |
          mkdir -p examples/local-demo/simulation-data/heapdumps
          mkdir -p examples/local-demo/simulation-data/checkpoints
          mkdir -p examples/local-demo/simulation-results/metrics
          mkdir -p examples/local-demo/simulation-results/reports
          mkdir -p examples/local-demo/simulation-results/logs

      - name: Build simulation framework
        run: |
          ./mvnw clean package -pl examples/local-demo -am -DskipTests

      - name: Build Docker image
        run: |
          cd examples/local-demo
          ./mvnw package -Pdocker -DskipTests

      - name: Verify Docker image
        run: |
          docker images | grep delos-node

      - name: Start Docker Compose cluster (10 nodes)
        working-directory: examples/local-demo
        run: |
          docker compose -f compose-simulation.yaml up -d --scale node=6
          echo "Cluster started with 10 nodes total (4 genesis + 6 members)"

      - name: Wait for cluster health
        working-directory: examples/local-demo
        run: |
          echo "Waiting for cluster to become healthy..."
          sleep 30
          docker compose -f compose-simulation.yaml ps

      - name: Verify cluster health
        working-directory: examples/local-demo
        run: |
          # Check bootstrap node health
          curl -f http://localhost:8080/health || (docker compose -f compose-simulation.yaml logs bootstrap && exit 1)

          # Check Prometheus is up
          curl -f http://localhost:9091/-/healthy || (docker compose -f compose-simulation.yaml logs prometheus && exit 1)

          echo "Cluster health check passed"

      - name: Run 1-hour simulation with chaos testing
        working-directory: examples/local-demo
        run: |
          ./mvnw exec:java -Psimulation \
            -Dexec.mainClass=com.hellblazer.delos.demo.simulation.SimulationOrchestrator \
            -Dsimulation.duration.hours=1 \
            -Dsimulation.nodeCount=10 \
            -Dsimulation.enableHeapDumps=true \
            -Dsimulation.enableChaos=true \
            -Dsimulation.chaosStrategy=PHASE_BASED \
            -Dsimulation.prometheusUrl=http://localhost:9091

      - name: Verify reports generated
        working-directory: examples/local-demo
        run: |
          echo "Checking for generated reports..."
          ls -lh simulation-results/reports/
          test -f simulation-results/reports/simulation-report.html || (echo "HTML report missing" && exit 1)
          test -f simulation-results/reports/simulation-report.json || (echo "JSON report missing" && exit 1)
          echo "All reports generated successfully"

      - name: Collect container logs
        if: always()
        working-directory: examples/local-demo
        run: |
          docker compose -f compose-simulation.yaml logs > simulation-results/logs/docker-compose.log 2>&1 || true
          docker compose -f compose-simulation.yaml logs bootstrap > simulation-results/logs/bootstrap.log 2>&1 || true
          docker compose -f compose-simulation.yaml logs kernel1 > simulation-results/logs/kernel1.log 2>&1 || true

      - name: Upload simulation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-reports-short-${{ github.run_number }}
          path: examples/local-demo/simulation-results/reports/
          retention-days: 30

      - name: Upload simulation metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-metrics-short-${{ github.run_number }}
          path: examples/local-demo/simulation-results/metrics/
          retention-days: 30

      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-logs-short-${{ github.run_number }}
          path: examples/local-demo/simulation-results/logs/
          retention-days: 7

      - name: Cleanup Docker resources
        if: always()
        working-directory: examples/local-demo
        run: |
          docker compose -f compose-simulation.yaml down -v
          docker system prune -f

      - name: Comment on PR with summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'examples/local-demo/simulation-results/reports/simulation-report.json';

            if (!fs.existsSync(reportPath)) {
              console.log('Report file not found, skipping PR comment');
              return;
            }

            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));

            const comment = `## Simulation Results (1h validation)

            **Duration:** ${report.duration || '1h'}
            **Nodes:** ${report.nodeCount || 10}
            **Status:** ${report.status || 'Unknown'}

            ### Key Metrics
            - Transaction Latency P99: ${report.latencyP99 || 'N/A'}
            - Transaction Rate: ${report.transactionRate || 'N/A'}
            - Heap Usage: ${report.heapUsage || 'N/A'}

            [View detailed report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
