syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.hellblazer.delos.thoth.proto";
option java_outer_classname = "ThothProto";
option objc_class_prefix = "Tp";

import "google/protobuf/empty.proto";

import "stereotomy.proto";
import "stereotomy-services.proto";
import "crypto.proto";

package thoth;

// ─── KerlDht ─────────────────────────────────────────────────────────────────
// DHT-distributed KERL access.  Mirrors stereotomy-services.proto's KERLService
// with two differences:
//   1. Read RPCs return SignedDhtResponse (BLS-signed envelope) for Byzantine
//      response verification (Phase A).  Write RPCs reuse KERLService's message
//      types directly via stereotomy.services.* imports.
//   2. getKeyEvent(Digeste) is omitted — DHT does not expose digest-based lookups.
// Proto3 does not support service inheritance, so the RPC duplication is
// structural and intentional.  Keep KERLService in sync when adding/removing RPCs.
// ─────────────────────────────────────────────────────────────────────────────
service KerlDht {
  rpc append (stereotomy.services.KeyEventsContext) returns (stereotomy.services.KeyStates) {}
  rpc appendKERL (stereotomy.services.KERLContext) returns (stereotomy.services.KeyStates) {}
  rpc appendWithAttachments (stereotomy.services.KeyEventWithAttachmentsContext) returns (stereotomy.services.KeyStates) {}
  rpc appendAttachments (stereotomy.services.AttachmentsContext) returns (google.protobuf.Empty) {}
  rpc appendValidations (stereotomy.Validations) returns (google.protobuf.Empty) {}

  rpc getAttachment (stereotomy.EventCoords) returns (SignedDhtResponse) {}
  rpc getKeyEventCoords (stereotomy.EventCoords) returns (SignedDhtResponse) {}
  rpc getKeyState (stereotomy.Ident) returns (SignedDhtResponse) {}
  rpc getKeyStateSeqNum (stereotomy.IdentAndSeq) returns (SignedDhtResponse) {}
  rpc getKeyStateCoords (stereotomy.EventCoords) returns (SignedDhtResponse) {}
  rpc getKeyStateWithAttachments (stereotomy.EventCoords) returns (SignedDhtResponse) {}
  rpc getKeyStateWithEndorsementsAndValidations (stereotomy.EventCoords) returns (SignedDhtResponse) {}
  rpc getKERL (stereotomy.Ident) returns (SignedDhtResponse) {}
  rpc getValidations (stereotomy.EventCoords) returns (SignedDhtResponse) {}
}

service Delegated {
  rpc reconcile (Intervals) returns (Update) {}
  rpc update (Updating) returns (google.protobuf.Empty) {}
}

service Reconciliation {
  rpc reconcile (Intervals) returns (Update) {}
  rpc update (Updating) returns (google.protobuf.Empty) {}
}

service Thoth_ {
  rpc commit (stereotomy.EventCoords) returns (google.protobuf.Empty) {}
  rpc identifier(google.protobuf.Empty) returns (stereotomy.Ident) {}
  rpc inception(stereotomy.Ident) returns (stereotomy.InceptionEvent) {}
  rpc rotate(google.protobuf.Empty) returns (stereotomy.RotationEvent) {}
}

message Update {
  repeated stereotomy.KeyEventWithAttachmentAndValidations_ events = 1;
  repeated Interval intervals = 2;
  crypto.Biff have = 3;
}

message Updating {
  int32 ring = 1;
  repeated stereotomy.KeyEventWithAttachmentAndValidations_ events = 2;
}

message Intervals {
  int32 ring = 1;
  repeated Interval intervals = 2;
  crypto.Biff have = 3;
}

message Interval {
  crypto.Digeste start = 1;
  crypto.Digeste end = 2;
}

message ViewState {
  crypto.Digeste crown = 1;
  crypto.Digeste previous = 2;
  crypto.Biff roots = 3;
  int32 threshold = 4;
  stereotomy.Validations validations = 5;
}

// A DHT response signed by the responding member.
// Phase A rollout: sig field is optional for backward compatibility with
// older server versions that do not yet populate response signatures.
// Clients MUST accept responses where sig is absent (hasSig() == false).
message SignedDhtResponse {
  bytes content = 1;       // Serialized protobuf of the actual response
  crypto.Sig sig = 2;      // Signature over content, signed by responding member
}
