# Combined Delos Cluster - All nodes in one compose file
#
# This file defines a complete Delos cluster with:
# - 1 bootstrap node (genesis initiator)
# - 3 kernel nodes (BFT quorum with bootstrap = 4 nodes for f=1)
# - Scalable member nodes (join after genesis)
#
# Usage:
#   # Build the Docker image first
#   mvn package -Pdocker -pl examples/local-demo -am
#
#   # Start the complete cluster (5 nodes default)
#   docker compose up -d
#
#   # View logs
#   docker compose logs -f
#
#   # Scale to 100 nodes (96 members + 4 genesis)
#   docker compose up -d --scale node=96
#
#   # Monitor cluster formation
#   docker compose logs -f | grep "Status:"
#
#   # Stop and cleanup
#   docker compose down -v
#
# Resource Requirements for 100-node cluster:
#   - Memory: ~32GB (256MB per node + overhead)
#   - CPU: 8+ cores recommended
#   - Disk: Minimal (in-memory state)
#
services:
  # Bootstrap node - starts first, initializes cluster
  bootstrap:
    image: delos-node:latest
    container_name: delos-bootstrap
    hostname: bootstrap
    environment:
      DELOS_NODE_TYPE: 'bootstrap'
      DELOS_NODE_ID: 'bootstrap-0'
      DELOS_GRPC_PORT: '9999'
      DELOS_METRICS_PORT: '9090'
      DELOS_DISCOVERY_PORT: '8080'
      DELOS_CARDINALITY: '120'
      DELOS_BIAS: '3'
      DELOS_PBYZ: '0.1'
      DELOS_GOSSIP_DURATION_MS: '50'
      DELOS_SEEDING_TIMEOUT_S: '180'
      JAVA_OPTS: '-Xmx256m -Xms128m -XX:+UseZGC'
    ports:
      - "9999:9999"   # gRPC endpoint
      - "9090:9090"   # Prometheus metrics
      - "8080:8080"   # Health endpoint
    networks:
      delos-net:
        aliases:
          - bootstrap
          - delos-bootstrap
    volumes:
      - bootstrap-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M

  # Kernel nodes - form BFT quorum with bootstrap
  kernel1:
    image: delos-node:latest
    container_name: delos-kernel1
    hostname: kernel1
    environment:
      DELOS_NODE_TYPE: 'kernel'
      DELOS_NODE_ID: 'kernel-1'
      DELOS_BOOTSTRAP_HOST: 'bootstrap'
      DELOS_BOOTSTRAP_PORT: '9999'
      DELOS_GRPC_PORT: '9999'
      DELOS_METRICS_PORT: '9090'
      DELOS_DISCOVERY_PORT: '8080'
      DELOS_CARDINALITY: '120'
      DELOS_GOSSIP_DURATION_MS: '50'
      DELOS_SEEDING_TIMEOUT_S: '180'
      JAVA_OPTS: '-Xmx256m -Xms128m -XX:+UseZGC'
    networks:
      - delos-net
    volumes:
      - kernel1-data:/data
    depends_on:
      bootstrap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 384M

  kernel2:
    image: delos-node:latest
    container_name: delos-kernel2
    hostname: kernel2
    environment:
      DELOS_NODE_TYPE: 'kernel'
      DELOS_NODE_ID: 'kernel-2'
      DELOS_BOOTSTRAP_HOST: 'bootstrap'
      DELOS_BOOTSTRAP_PORT: '9999'
      DELOS_GRPC_PORT: '9999'
      DELOS_METRICS_PORT: '9090'
      DELOS_DISCOVERY_PORT: '8080'
      DELOS_CARDINALITY: '120'
      DELOS_GOSSIP_DURATION_MS: '50'
      DELOS_SEEDING_TIMEOUT_S: '180'
      JAVA_OPTS: '-Xmx256m -Xms128m -XX:+UseZGC'
    networks:
      - delos-net
    volumes:
      - kernel2-data:/data
    depends_on:
      bootstrap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 384M

  kernel3:
    image: delos-node:latest
    container_name: delos-kernel3
    hostname: kernel3
    environment:
      DELOS_NODE_TYPE: 'kernel'
      DELOS_NODE_ID: 'kernel-3'
      DELOS_BOOTSTRAP_HOST: 'bootstrap'
      DELOS_BOOTSTRAP_PORT: '9999'
      DELOS_GRPC_PORT: '9999'
      DELOS_METRICS_PORT: '9090'
      DELOS_DISCOVERY_PORT: '8080'
      DELOS_CARDINALITY: '120'
      DELOS_GOSSIP_DURATION_MS: '50'
      DELOS_SEEDING_TIMEOUT_S: '180'
      JAVA_OPTS: '-Xmx256m -Xms128m -XX:+UseZGC'
    networks:
      - delos-net
    volumes:
      - kernel3-data:/data
    depends_on:
      bootstrap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 384M

  # Scalable member nodes - join after kernel is ready
  # Use: docker compose up -d --scale node=96 for 100-node cluster
  node:
    image: delos-node:latest
    environment:
      DELOS_NODE_TYPE: 'member'
      DELOS_BOOTSTRAP_HOST: 'bootstrap'
      DELOS_BOOTSTRAP_PORT: '9999'
      DELOS_GRPC_PORT: '9999'
      DELOS_METRICS_PORT: '9090'
      DELOS_DISCOVERY_PORT: '8080'
      DELOS_CARDINALITY: '120'
      DELOS_GOSSIP_DURATION_MS: '50'
      DELOS_SEEDING_TIMEOUT_S: '300'
      JAVA_OPTS: '-Xmx256m -Xms128m -XX:+UseZGC'
    networks:
      - delos-net
    depends_on:
      kernel1:
        condition: service_healthy
      kernel2:
        condition: service_healthy
      kernel3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 384M
      replicas: 1  # Use --scale node=96 for 100-node cluster

  # === Monitoring Stack ===
  # Prometheus - metrics collection and alerting
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: delos-prometheus
    hostname: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=7d'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"   # Prometheus UI (9091 to avoid conflict with node metrics)
    networks:
      - delos-net
    depends_on:
      bootstrap:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # Grafana - visualization and dashboards
  grafana:
    image: grafana/grafana:10.2.2
    container_name: delos-grafana
    hostname: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: delos
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: 'http://localhost:3000'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"   # Grafana UI
    networks:
      - delos-net
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  delos-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  bootstrap-data:
  kernel1-data:
  kernel2-data:
  kernel3-data:
  prometheus-data:
  grafana-data:
