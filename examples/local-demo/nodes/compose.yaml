# Additional nodes - Scalable cluster members
#
# These nodes join after the kernel (minimal quorum) is established.
# They participate in consensus but did not generate the Genesis block.
#
# IMPORTANT: Start these ONLY AFTER:
#   1. Bootstrap node is running
#   2. All 3 kernel nodes have started
#   3. Kernel has generated the Genesis block (allow ~10-30 seconds)
#
# Scaling: Use docker compose --scale to add more nodes:
#   docker compose up --scale node=5
#
# Environment Variables:
#   GENESIS: false - joining nodes don't participate in Genesis
#   NODE_TYPE: member - regular cluster member
#   BOOTSTRAP_HOST: delos-bootstrap - rendezvous point for joining
#
services:
  node:
    image: alpine:latest
    environment:
      GENESIS: 'false'
      NODE_TYPE: 'member'
      BOOTSTRAP_HOST: 'delos-bootstrap'
    command: |
      sh -c '
        NODE_ID="node-$$HOSTNAME"
        echo "=== Delos Cluster Node ==="
        echo "Node ID: $$NODE_ID"
        echo "Genesis Mode: $$GENESIS"
        echo "Type: $$NODE_TYPE"
        echo "Bootstrap: $$BOOTSTRAP_HOST"
        echo ""
        echo "Node joining established cluster..."
        sleep 3
        echo "Connected to bootstrap node"
        echo "Cluster membership obtained"
        echo "Node operational"
        echo ""
        tail -f /dev/null
      '
    networks:
      - delos-net
    healthcheck:
      test: ["CMD", "echo", "healthy"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s

# Reference the external network created by bootstrap
networks:
  delos-net:
    external: true
    name: bootstrap_delos-net
