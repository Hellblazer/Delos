# Bootstrap member - First node in the cluster
#
# This node initializes the cluster and acts as the well-known rendezvous point
# for other nodes to join. It must start first and reach a stable state before
# kernel nodes are added.
#
# Network: Uses bridge network with well-known address for discovery
#
# Environment Variables:
#   GENESIS: true - indicates this is a bootstrap/kernel node
#   NODE_TYPE: bootstrap - identifies this as the initial bootstrap node
#
services:
  bootstrap:
    image: alpine:latest
    container_name: delos-bootstrap
    environment:
      GENESIS: 'true'
      NODE_TYPE: 'bootstrap'
      NODE_ID: 'bootstrap-0'
    command: |
      sh -c '
        echo "=== Delos Bootstrap Node ==="
        echo "Node ID: $$NODE_ID"
        echo "Genesis Mode: $$GENESIS"
        echo "Type: $$NODE_TYPE"
        echo ""
        echo "Bootstrap node ready - cluster initialized"
        echo "Waiting for kernel nodes to join..."
        echo ""
        # Keep container running to demonstrate pattern
        tail -f /dev/null
      '
    networks:
      - delos-net
    healthcheck:
      test: ["CMD", "echo", "healthy"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  delos-net:
    driver: bridge
