# Bootstrap member - First node in the cluster
#
# This node initializes the cluster and acts as the well-known rendezvous point
# for other nodes to join. It must start first and reach a stable state before
# kernel nodes are added.
#
# Network: Uses bridge network with well-known address for discovery
#
# Usage:
#   docker compose -f bootstrap/compose.yaml up -d
#   docker compose -f bootstrap/compose.yaml logs -f
#
services:
  bootstrap:
    image: delos-node:latest
    container_name: delos-bootstrap
    hostname: bootstrap
    environment:
      DELOS_NODE_TYPE: 'bootstrap'
      DELOS_NODE_ID: 'bootstrap-0'
      DELOS_GRPC_PORT: '9999'
      DELOS_METRICS_PORT: '9090'
      DELOS_CARDINALITY: '10'
      DELOS_BIAS: '3'
      DELOS_PBYZ: '0.1'
      DELOS_GOSSIP_DURATION_MS: '100'
      DELOS_SEEDING_TIMEOUT_S: '60'
      JAVA_OPTS: '-Xmx512m -Xms256m'
    ports:
      - "9999:9999"   # gRPC endpoint (exposed for external access)
      - "9090:9090"   # Prometheus metrics
    networks:
      delos-net:
        aliases:
          - bootstrap
          - delos-bootstrap
    volumes:
      - bootstrap-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/metrics"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

networks:
  delos-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  bootstrap-data:
