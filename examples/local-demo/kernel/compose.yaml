# Kernel members - Minimal quorum for BFT consensus
#
# These nodes join the bootstrap node to form the minimal quorum required
# for Byzantine Fault Tolerant consensus (4 nodes total: 1 bootstrap + 3 kernel).
#
# IMPORTANT: Start these AFTER the bootstrap node is stable and BEFORE adding
# additional nodes. Allow time for the kernel to generate the Genesis block.
#
# Usage:
#   # First start bootstrap
#   docker compose -f bootstrap/compose.yaml up -d
#   # Wait for bootstrap to be ready, then start kernel
#   docker compose -f kernel/compose.yaml up -d
#
services:
  kernel1:
    image: delos-node:latest
    container_name: delos-kernel1
    hostname: kernel1
    environment:
      DELOS_NODE_TYPE: 'kernel'
      DELOS_NODE_ID: 'kernel-1'
      DELOS_BOOTSTRAP_HOST: 'bootstrap'
      DELOS_BOOTSTRAP_PORT: '9999'
      DELOS_GRPC_PORT: '9999'
      DELOS_METRICS_PORT: '9090'
      DELOS_CARDINALITY: '10'
      DELOS_BIAS: '3'
      DELOS_PBYZ: '0.1'
      DELOS_GOSSIP_DURATION_MS: '100'
      DELOS_SEEDING_TIMEOUT_S: '60'
      JAVA_OPTS: '-Xmx512m -Xms256m'
    networks:
      - delos-net
    volumes:
      - kernel1-data:/data
    depends_on:
      bootstrap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/metrics"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

  kernel2:
    image: delos-node:latest
    container_name: delos-kernel2
    hostname: kernel2
    environment:
      DELOS_NODE_TYPE: 'kernel'
      DELOS_NODE_ID: 'kernel-2'
      DELOS_BOOTSTRAP_HOST: 'bootstrap'
      DELOS_BOOTSTRAP_PORT: '9999'
      DELOS_GRPC_PORT: '9999'
      DELOS_METRICS_PORT: '9090'
      DELOS_CARDINALITY: '10'
      DELOS_BIAS: '3'
      DELOS_PBYZ: '0.1'
      DELOS_GOSSIP_DURATION_MS: '100'
      DELOS_SEEDING_TIMEOUT_S: '60'
      JAVA_OPTS: '-Xmx512m -Xms256m'
    networks:
      - delos-net
    volumes:
      - kernel2-data:/data
    depends_on:
      bootstrap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/metrics"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

  kernel3:
    image: delos-node:latest
    container_name: delos-kernel3
    hostname: kernel3
    environment:
      DELOS_NODE_TYPE: 'kernel'
      DELOS_NODE_ID: 'kernel-3'
      DELOS_BOOTSTRAP_HOST: 'bootstrap'
      DELOS_BOOTSTRAP_PORT: '9999'
      DELOS_GRPC_PORT: '9999'
      DELOS_METRICS_PORT: '9090'
      DELOS_CARDINALITY: '10'
      DELOS_BIAS: '3'
      DELOS_PBYZ: '0.1'
      DELOS_GOSSIP_DURATION_MS: '100'
      DELOS_SEEDING_TIMEOUT_S: '60'
      JAVA_OPTS: '-Xmx512m -Xms256m'
    networks:
      - delos-net
    volumes:
      - kernel3-data:/data
    depends_on:
      bootstrap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/metrics"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

# Reference the external network created by bootstrap
networks:
  delos-net:
    external: true
    name: bootstrap_delos-net

volumes:
  kernel1-data:
  kernel2-data:
  kernel3-data:
