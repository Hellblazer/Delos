# Kernel members - Minimal quorum for BFT consensus
#
# These nodes join the bootstrap node to form the minimal quorum required
# for Byzantine Fault Tolerant consensus (4 nodes total: 1 bootstrap + 3 kernel).
#
# IMPORTANT: Start these AFTER the bootstrap node is stable and BEFORE adding
# additional nodes. Allow time for the kernel to generate the Genesis block.
#
# Environment Variables:
#   GENESIS: true - kernel nodes participate in Genesis block generation
#   NODE_TYPE: kernel - identifies these as kernel quorum members
#   BOOTSTRAP_HOST: delos-bootstrap - references the bootstrap node for joining
#
services:
  kernel1:
    image: alpine:latest
    container_name: delos-kernel1
    environment:
      GENESIS: 'true'
      NODE_TYPE: 'kernel'
      NODE_ID: 'kernel-1'
      BOOTSTRAP_HOST: 'delos-bootstrap'
    command: |
      sh -c '
        echo "=== Delos Kernel Node ==="
        echo "Node ID: $$NODE_ID"
        echo "Genesis Mode: $$GENESIS"
        echo "Type: $$NODE_TYPE"
        echo "Bootstrap: $$BOOTSTRAP_HOST"
        echo ""
        echo "Kernel node joining cluster..."
        sleep 2
        echo "Connected to bootstrap node"
        echo "Participating in Genesis block generation..."
        echo ""
        # Keep container running
        tail -f /dev/null
      '
    networks:
      - delos-net
    depends_on:
      - bootstrap
    healthcheck:
      test: ["CMD", "echo", "healthy"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  kernel2:
    image: alpine:latest
    container_name: delos-kernel2
    environment:
      GENESIS: 'true'
      NODE_TYPE: 'kernel'
      NODE_ID: 'kernel-2'
      BOOTSTRAP_HOST: 'delos-bootstrap'
    command: |
      sh -c '
        echo "=== Delos Kernel Node ==="
        echo "Node ID: $$NODE_ID"
        echo "Genesis Mode: $$GENESIS"
        echo "Type: $$NODE_TYPE"
        echo "Bootstrap: $$BOOTSTRAP_HOST"
        echo ""
        echo "Kernel node joining cluster..."
        sleep 2
        echo "Connected to bootstrap node"
        echo "Participating in Genesis block generation..."
        echo ""
        tail -f /dev/null
      '
    networks:
      - delos-net
    depends_on:
      - bootstrap
    healthcheck:
      test: ["CMD", "echo", "healthy"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  kernel3:
    image: alpine:latest
    container_name: delos-kernel3
    environment:
      GENESIS: 'true'
      NODE_TYPE: 'kernel'
      NODE_ID: 'kernel-3'
      BOOTSTRAP_HOST: 'delos-bootstrap'
    command: |
      sh -c '
        echo "=== Delos Kernel Node ==="
        echo "Node ID: $$NODE_ID"
        echo "Genesis Mode: $$GENESIS"
        echo "Type: $$NODE_TYPE"
        echo "Bootstrap: $$BOOTSTRAP_HOST"
        echo ""
        echo "Kernel node joining cluster..."
        sleep 2
        echo "Connected to bootstrap node"
        echo "Participating in Genesis block generation..."
        echo ""
        tail -f /dev/null
      '
    networks:
      - delos-net
    depends_on:
      - bootstrap
    healthcheck:
      test: ["CMD", "echo", "healthy"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

# Reference the external network created by bootstrap
networks:
  delos-net:
    external: true
    name: bootstrap_delos-net
